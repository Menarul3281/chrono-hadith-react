    <title>Chrono-Hadith · Islamic Knowledge Atlas</title>
    <meta name="description" content="An interactive Islamic knowledge atlas connecting the Prophet ﷺ, narrators, hadith reports, places, events, dynasties and books." />
    <meta name="theme-color" content="#eef8f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061512" media="(prefers-color-scheme: dark)" />
    <script>
      /* Set appearance before CSS paints. The theme module remains the single
         owner of changes after startup and keeps following the OS until a
         reader explicitly chooses an appearance. */
      try {
        const savedTheme = localStorage.getItem('chrono.theme.v1');
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = savedTheme === 'dark' || savedTheme === 'light'
          ? savedTheme
          : systemTheme;
      } catch {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light';
      }
    </script>
